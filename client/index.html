<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aloka — Your Finance. Your Knowledge. Your Aloka. Explore financial insights, tax guidance, calculators, and services."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Aloka | Finance, Taxation & Financial Knowledge</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('aloka-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : systemPrefersDark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body class="bg-background text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
